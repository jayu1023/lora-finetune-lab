name: ci

# Only the fast, deterministic parts run in CI: the dataset generator, the
# prompt/parsing contract, and the scoring maths. Training and evaluation need a
# model download and a GPU, so they are not gated here — the notebook and the
# committed eval artifacts are the evidence for those.
#
# This job installs pytest and nothing else, which is why `score()` lives in
# src/scoring.py rather than src/evaluate.py: evaluate.py imports torch at module
# level and uses @torch.inference_mode() as a decorator, so it cannot be imported
# at all without torch. Keeping the maths in a torch-free module is what makes
# this job take seconds instead of pulling ~200MB per run.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pytest
      - run: python src/make_dataset.py
      - run: python -m pytest tests/test_dataset.py tests/test_scoring.py tests/test_prompts.py
